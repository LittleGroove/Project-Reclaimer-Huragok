# The engine as a Python package. Hosts don't need this: start.cmd / start.sh
# install what the engine needs (requirements.txt) and run it from this folder.
# Developers: pip install -e "engine[test]" from the repository's top folder.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "huragok"
dynamic = ["version"]  # from huragok/__init__.py
description = "Huragok, the Engineer for Project Reclaimer dedicated servers: the Superintendent keeps them up, Vergil watches over the players with automod and in-game commands for the roles you pick."
requires-python = ">=3.11"
authors = [{ name = "LittleGroove" }]
keywords = ["halo", "halo-3", "halo-3-odst", "project-reclaimer", "dedicated-server", "rcon", "moderation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: First Person Shooters",
]
# Keep in step with requirements.txt, which the start scripts install.
dependencies = [
    "websockets>=13",
    "psutil>=5.9",
    "discord.py>=2.7,<3",
]

[project.optional-dependencies]
test = ["pytest>=9"]  # 9: faulthandler_exit_on_timeout

[project.scripts]
huragok = "huragok.commandline.cli:main"

[tool.setuptools.packages.find]
include = ["huragok*"]

[tool.setuptools.dynamic]
version = { attr = "huragok.__version__" }

[tool.setuptools.package-data]
huragok = ["templates/*.toml", "templates/*.txt", "templates/*.json", "templates/packages/*/*.toml",
                        "templates/packages/*/playlists/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A test that hangs prints every thread's stack and ends the run, instead of holding it until CI gives up.
faulthandler_timeout = 180
faulthandler_exit_on_timeout = true
markers = [
    "slow: starts real processes (fake servers, start.cmd, several Pythons); skip them with -m \"not slow\"",
    "asyncio_errors: the test makes asyncio log an error on purpose (otherwise that fails the test)",
]
# An exception nobody could catch (in __del__, a callback, a thread) and a coroutine never awaited fail the test.
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::RuntimeWarning",
]
