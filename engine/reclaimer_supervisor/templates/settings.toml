# Reclaimer Supervisor: how it runs.
#
# This folder is the root. The other files in it:
#   commands.toml   who's who, and which in-game commands each role can use
#   automod.txt     automod's word list
#   SERVERS/        one folder per server: what `dedicated init` makes (dedicated.toml,
#                   project-reclaimer.exe, game/, data/...). Add a folder, and the server
#                   appears in the window within seconds; remove it once it's stopped.
# commands.toml and automod.txt apply edits within seconds. Edits to this file apply
# when the supervisor starts again (the servers keep running meanwhile).
# Check everything without starting anything: start.cmd check (Linux: ./start.sh check)
#
# Relative paths are from this folder.

# Where the server folders are.
servers_folder = "{servers_folder}"
# One server folder somewhere else (the folder holding dedicated.toml), on top of the
# ones in servers_folder. ".." is the folder this one sits in (the 0.1 layout).
server_folder = "{server_folder}"
# The name of each server folder's configuration file.
dedicated_config = "dedicated.toml"

# Who starts the servers:
#   process  the supervisor: one `dedicated` per server, started and restarted from
#            here, so start.cmd (Linux: ./start.sh) is how your servers start from now
#            on. Windows runs project-reclaimer.exe itself; Linux runs it through wine.
#   docker   the official Docker setup: the supervisor runs `docker compose` for each
#            server's container (see [docker] below).
#   command  your own commands, such as systemd units (see [command] below).
#   attach   something else (a startup task, a window you opened). The supervisor
#            watches and moderates, but can't restart anything.
backend = "{backend}"

# Which servers, by name as in their dedicated.toml. Empty: every enabled server found.
servers = []

# The name players read when the supervisor itself acts ("restarting…").
name = "Supervisor"

# true: record every moderation action as "would have…" without doing it.
dry_run = false

# Its records (every player seen, every action with who and why) and its log.
database = "records/supervisor.sqlite3"
log_file = "logs/supervisor.log"


[restarts]
# Chat warnings before a planned stop or restart: this many seconds before it, in
# turn ("Server restarting in 5 minutes: daily restart."). Nobody on: no countdown,
# and a countdown ends early once everyone has left.
warn_seconds = [300, 180, 60, 30]
# A restart "after this game": seconds of notice once the game has ended.
after_game_seconds = 15
# Restart every server every day at this local time (24-hour clock), like "04:00".
# Empty: never. One server's own time goes in its [[server]] block below.
daily_restart = ""
# A daily restart waits until the server has been up this long.
min_uptime_seconds = 900
# A server that died: wait this long before each new start, in turn (the last repeats).
backoff_seconds = [5, 10, 30, 60, 300]
# A server that dies within this long of starting counts as a failed start…
good_run_seconds = 600
# …and this many failed starts in a row stop the supervisor trying: the window shows
# FAULTED, logs/faulted-<server>.txt says why, and S starts it again.
max_failures = 5
# More automatic restarts than this in one hour means something is looping: FAULTED.
restarts_per_hour = 6
# A started server must answer on RCON within this many seconds, or it's a failed start.
ready_seconds = 300
# A countdown ends once nobody has been on for this many seconds.
empty_seconds = 10


[automod]
# Removes players for the words in automod.txt, said in chat or used in a name.
# Each line there has the words, how long each offence keeps a player out, and
# how many chances they get before a ban: see docs/automod.md.
# It starts in dry run: watch logs/supervisor.log for what it would do, then set
# dry_run = false.
enabled = true
dry_run = true
words = "automod.txt"
forget_after_days = 0                # strikes older than this stop counting; 0: never
name = "AutoMod"                     # players read "removed by AutoMod"
exempt_roles = ["admin", "owner"]    # never acted on (roles as in commands.toml; "player" is everyone)
check_names = true                   # check names as players join
cooldown_seconds = 10                # lines this close together count as one strike
split_seconds = 10                   # a word split over lines this close together is caught

[watchdog]
# Notices a server struggling (slow frames, stuck on the scoreboard after a game)
# or dead: every player dropped at once after a game, and nobody can join again.
#   watch  log what it would do; leave it here a few nights to see what it thinks
#   act    restart a struggling server after the game, and a dead one at once
#          (not with backend attach). In watch, a dead server waits for the
#          server program's own rule, which restarts it after five minutes.
enabled = true
mode = "watch"
report_minutes = 15                  # a health line in the log this often; 0: never

[keepalive]
# A server that has stopped responding: status.json not rewritten (normally every
# 5 seconds) AND RCON silent, both for this long. The game's own supervisor
# waits five minutes without frames before acting.
hang_seconds = 180
check_seconds = 10
act = true                           # restart it (not with backend attach); false: only report

[eventlog]
# Every event as a line of JSON, one file per UTC day: what the server sends.
# Player IPs are in it: keep the folder private.
enabled = false
folder = "logs/events"


[updates]
# New versions of the supervisor (not the game server), from its GitHub releases.
# It never installs one unless you say so: when one is out, the window says so;
# press U there, or run start.cmd update (Linux: ./start.sh update). Your servers
# keep running while it updates, and only the program is replaced: your settings,
# commands, word list and records stay.
check = true
check_hours = 6
# true: install a new version by itself the next time a server restarts.
install_on_server_restart = false
repository = "LittleGroove/Project-Reclaimer-Server-Supervisor"

[server_updates]
# New releases of the server program (Project Reclaimer itself), from its GitHub
# releases. Players must be on exactly the server's version, so a server left behind
# empties out. The supervisor looks every few hours, compares with the version each
# running server reports, and says so in the window. Installing: the new program is
# checked against the release's SHA256SUMS.txt, put in place of every copy in the
# server folders (and the root's; the old ones are kept in records/previous-program/),
# and each running server restarts after its game, or now. The server's own
# auto_update would restart every server the moment a release downloads, mid-game.
check = true
check_hours = 6
# "ask": only say so (press U, or start.cmd update --program); "after_game": install
# by itself and restart each server after its game; "now": install and restart at once.
install = "ask"
repository = "ProjectReclaimer/project-reclaimer-releases"

[relay]
# A console for moderators elsewhere, through the supervisor: the official RCON
# client (or any tool speaking the server's WebSocket console) connects to the
# supervisor instead of a server, each moderator with a password and name of their
# own. Their commands go through the supervisor's own connection (the 4 console
# spots stay free), only the commands their role allows pass (the same lists as
# commands.toml: a moderator can mute, not ban), players read "kicked by Alice",
# and every command is logged. Each server's console is at its game port plus
# port_offset (49176 -> 50176) for the RCON client and other WebSocket tools, and at
# its game port plus source_port_offset (49176 -> 51176) for Source RCON tools (0
# switches that off). Not encrypted: keep address = "127.0.0.1" and reach it through
# an SSH tunnel or a VPN, as with the server's own console.
enabled = false
address = "127.0.0.1"
port_offset = 1000
source_port_offset = 2000
# One block per moderator. role: moderator, admin or owner. Passwords are 8 to 128
# characters, no two alike (the password is what tells moderators apart).
# [[relay.user]]
# name = "Alice"
# password = "a long passphrase only Alice knows"
# role = "moderator"

[setup]
# New servers: the window's N key, or start.cmd new "<name>" (Linux: ./start.sh new).
# Each new server is made with the server program's own `dedicated init`, a package
# from PACKAGES/ (its playlists, game types, maps and Workshop items), a free port and
# an RCON password of its own, then checked with `dedicated check`.
#
# What new servers take from this folder instead of carrying their own copy:
#   game     Halo 3's files (5.5 GB), once, at game/: linked from a server that has
#            them, or copied from MCC with dedicated init
#   content  one content/ folder (maps, game types, mods, images) every server can play
#   bans     one bans.json: one ban list, one admin list, one VPN allowance list
# Take one out to give each new server its own.
share = ["game", "content", "bans"]
# Your MCC folder, for copying Halo 3's files when no server has them yet. Empty
# means Steam's default folder; leave the line out to link from an existing server.
# mcc_folder = 'D:\SteamLibrary\steamapps\common\Halo The Master Chief Collection'
# Where the packages are.
packages_folder = "PACKAGES"
# The server program used to make and check folders, when it's in no server folder
# and not at the root (one project-reclaimer.exe at the root serves every server).
program = ""
# SteamCMD, for Workshop items (the window's I key sets this up: finds or installs
# it, signs the account in once, and writes [workshop] into every server folder).
# Empty: looked for in steamcmd/ here, C:\steamcmd, PATH. The account must own MCC;
# an anonymous sign-in can't fetch MCC's Workshop items. Never a password here.
steamcmd = ""
steam_username = ""

# How each backend runs the servers ---------------------------------------------

[process]
# The server program, in each server's folder.
executable = "{executable}"
# How it's run. Empty: the program itself on Windows, and `wine` + the program on
# Linux, as `dedicated run --config dedicated.toml` in the server's folder. To run it
# another way, give the whole command; {{executable}}, {{config}}, {{folder}} and
# {{name}} are filled in. Each server's process gets RECLAIMER_DEDICATED_ONLY, so it
# runs that server alone.
# command = ["wine", "{{executable}}", "dedicated", "run", "--config", "{{config}}"]
command = []
# Seconds to wait for a clean stop (Ctrl+Break on Windows, SIGINT on Linux) before
# ending the process.
stop_timeout = 30
# false: closing the supervisor leaves the servers running, so players aren't
# disturbed, and starting it again picks them up. start.cmd stop stops both.
# true: closing the supervisor stops the servers too.
stop_servers_on_exit = false
# Start servers with RECLAIMER_DEDICATED_AUTO_UPDATE=false: the built-in updater
# restarts every server the moment a release downloads, mid-game.
disable_auto_update = true

[docker]
# In each server's folder. The server's service name is set in its [[server]] block
# below (service = "server-1"); otherwise server-1, server-2… in order.
compose_file = "{compose_file}"

[command]
# {{name}}, {{slug}} (the data folder name), {{service}}, {{port}}, {{folder}} and {{config}} are filled in.
# start = "systemctl start reclaimer@{{slug}}"
# stop = "systemctl stop reclaimer@{{slug}}"
# restart = "systemctl restart reclaimer@{{slug}}"

[rcon]
# Sign in on the console spot each server keeps for its own machine, so
# moderators keep all 4 normal spots. Needs the supervisor on the same machine.
use_host_key = true
command_timeout = 10

# Settings for one server, by name as in its dedicated.toml, when needed. The
# window's T key writes autostart here.
# [[server]]
# name = "Reclaimer Slayer"
# autostart = true                # started whenever the supervisor starts
# daily_restart = "05:00"         # instead of [restarts] daily_restart
# service = "server-1"            # its docker compose service
# data = "data/reclaimer-slayer"  # its data folder, when it isn't found by itself
# rcon_host = "127.0.0.1"
# rcon_port = 49176
