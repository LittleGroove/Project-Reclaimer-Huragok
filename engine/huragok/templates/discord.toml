audit-setup              = { channel = "logs", colour = "purple", post = true, ping = "" }
# News for everyone: a post each
seeding-wanted           = { channel = "info", colour = "chartreuse", post = true, ping = "", remove_after_minutes = 30 }
notify-told              = { channel = "info", colour = "lime", post = true, ping = "", remove_after_minutes = 60 }
servers-restart-planned  = { channel = "info", colour = "gold", post = true, ping = "", remove_after_minutes = 120 }
servers-program-updated  = { channel = "info", colour = "blue", post = true, ping = "" }
