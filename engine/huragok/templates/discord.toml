# ---------------------------------------------------------------------------------
# discord.toml: Huragok's Discord bot.
#
# Every feature is off until you set it up. Set it up in Huragok's window, in Discord
# with /huragok setup, or here; all three change this file. Huragok reloads it a few
# seconds after it changes. A setting it doesn't know is only a warning. A file it can't
# read leaves what's in force as it was, and says why; at the start, the bot stays off.
# Your servers carry on either way.
#
# Channels and roles: an ID (the setup writes IDs, with the name as a note) or a name
# ("#admin-log", "@Server Admin"), which Huragok looks up and replaces with the ID.
# Servers: their names as in Huragok's window, or "*" for every server.
# A feature that's on but missing something says what: /huragok check, or the window.
# ---------------------------------------------------------------------------------

mode = "off"                   # off | webhook (posts only, no bot) | bot (everything)
token = ""                     # bot mode: the bot's token. It's a password: keep this file to yourself.
token_variable = ""            # or the name of an environment variable that holds the token
guild = ""                     # the Discord the bot works in (the setup lists the ones it's in)
voice = "lore"                 # lore: the Superintendent, Vergil and Huragok speak | plain: plain words


# ---------------------------------------------------------------------------------
# Who's who: Discord roles onto Huragok's ranks. Nothing counts until it's here.
# What each rank may do is commands.toml's job, in game and in Discord alike.
[ranks]
admin = []                     # roles whose members are Huragok admins on every server, e.g. ["@Server Admin"]
moderator = []                 # e.g. ["@Server Mod"]
probationary_moderator = []    # e.g. ["@Probation"]: their actions are requests a moderator confirms
member = []                    # e.g. ["@Member"]
owners = []                    # Discord USER IDs with owner rights from Discord. People, never a role.
discord_administrators = "nothing"  # what Discord's own Administrator permission counts as: nothing | moderator | admin
owners_in_game = "owner"       # what an owner of the bot acts as, running commands from Discord: owner | admin
moderators_see_ids = false     # moderators see players' 64-character IDs in Discord
timeout_suspends = true        # a member timed out in Discord can't use their rank meanwhile


# ---------------------------------------------------------------------------------
# The channels, by what happens in them. The channel decides how a message looks: send one to `staff` and it's a
# ticket, to `logs` and it's a record, to `info` and it's a post. See `[messages]`, below.
[channels]
# For everyone to read. Nobody should be able to type in these.
status = ""                    # the server cards and nothing else, e.g. "#servers"
info = ""                      # news: pings people asked for, seeding, restarts planned, updates, e.g. "#server-news"
games = ""                     # games ending, and playlists changing with the player count
# Tickets: one card per incident, for staff to act on, updated until it's dealt with.
staff = ""                     # what Vergil did and who to keep an eye on, e.g. "#staff-tickets"
reports = ""                   # people asking staff for something: calls for an admin, reports, Contact. Empty: staff
appeals = ""                   # people appealing what's against them. Empty: reports
alerts = ""                    # what's wrong with the servers right now. Empty: staff
# Records, for staff. A card here keeps its buttons: acting on it sends it back to be dealt with.
logs = ""                      # what people did: moderators' actions, closed tickets, votes, joins, settings
huragok-logs = ""              # what Vergil and the Superintendent did, a feed of its own. Empty: logs
# Where staff type lines for a server.
console = ""


# ---------------------------------------------------------------------------------
# Tickets: one incident, one card. What's done on a card updates it, and it becomes the record: no card is ever
# posted about it. It stays usable wherever it is: acting on one in a log channel sends it back here, needing
# acknowledging again.
[tickets]
when_closed = "move"           # move: to its log channel | stay: where it is, in the closed colour | thread: where it is, with a thread of its own from the start, which closing locks and hides
stale_after_days = 2           # Vergil's and the Superintendent's untouched this long count as finished, in the stale colour. 0: never. People's wait until someone closes them. A line in [messages] can say its own: stale_after_hours = 12, as the watch list's and reports' do
close_rank = "moderator"       # who can Acknowledge or Close: moderator | admin | owner
buttons = ["mute", "kick", "ban", "whois", "note"]  # also "strike", "warn", "said". Mute and Kick ask how long, Ban is for good, Strike goes on the word list's ladder; each needs the same rank as its command in game
threads = true                 # a Discuss button, which makes a thread under the card for whoever presses it
evidence_lines = 5             # their chat before it, from every server
evidence_minutes = 30          # ...from this long before it at most, as it's read as what they said just now
record = true                  # their record ("2 mutes, 1 kick")
case_numbers = true            # the ledger's number for the action, as !whois has it
# A card's colour says where it stands. Untouched, and a person's own action, use their own line's colour in [messages].
colours = { active = "blurple", stale = "slate", closed = "green" }  # someone's acted and not acknowledged it | nobody touched it | someone said that's enough


# ---------------------------------------------------------------------------------
# Feeds: cards about what happened. [feeds] is every feed's default; each
# [feed.<name>] block changes only what it names. Which channel each message goes to,
# its colour and whether it posts at all are in [messages], below.
[feeds]
servers = "*"
silent = true                  # post without notifying anyone
style = "card"                 # card | compact (one line), for what's a post, not a ticket
public = false                 # true lets a feed post where @everyone can read
also = []                      # extra webhook URLs to post copies to (a partner's Discord)
merge_seconds = 30             # a burst of posts of the same kind (joins, say) becomes one when it's over

[feed.moderation]
enabled = false
webhook = ""                   # webhook mode: where it posts, unless a message says otherwise
persona = "vergil"
sources = ["*"]                # "!" | "/" (in game) | vergil | console | relay | window | discord | vote: which actions it shows

[feed.requests]                # a probationary moderator's request: a ticket with Confirm and Deny
enabled = false
webhook = ""
persona = "vergil"

[feed.vergil]
enabled = false
webhook = ""
persona = "vergil"

[feed.votes]
enabled = false
webhook = ""
persona = "vergil"

[feed.alerts]
enabled = false
webhook = ""
persona = "superintendent"
silent = false
launcher_webhook = ""          # the launcher posts "Huragok stopped; restarting" here (the bot is down then)
repeat_minutes = 30            # an ongoing problem is added to its ticket at most this often
recovery_summary = true        # when it's over: how long it was down
grace_seconds = 120            # no performance alerts this soon after a start

[feed.servers]
enabled = false
webhook = ""
persona = "superintendent"

[feed.games]
enabled = false
webhook = ""
persona = "superintendent"
min_players = 2

[feed.joins]
enabled = false
webhook = ""
persona = "superintendent"
returning_days = 30            # joins-back: back after this many days

[feed.watch]
enabled = false
webhook = ""
persona = "vergil"
back_after_kick_minutes = 15   # watch-back-after-kick: back within this long of the server letting them (it blocks a kicked player 10, 30, 60, then 120 minutes)
quiet_players = 2              # watch-first-time-quiet: someone new, with this few on

[feed.calls]
enabled = false
webhook = ""
persona = "vergil"
words = []                     # chat words that also call, as !calladmin does, e.g. ["admin pls"]
cooldown_seconds = 300         # per player
recent_lines = 5               # the server's last chat lines on the card

[feed.content]
enabled = false
webhook = ""
persona = "huragok"

[feed.audit]
enabled = false
webhook = ""
persona = "huragok"


# ---------------------------------------------------------------------------------
# Every kind of message the feeds post, one line each. Change where it goes, or switch it off.
#   channel: a name from [channels] ("staff"), or a channel itself ("#my-channel")
#   colour:  a name from [colours] below, or "#RRGGBB"
#   post:    false: this one isn't posted at all
#   ping:    who to ping when it's posted: a role, e.g. "@On Call", or several, e.g. ["@Moderators", "@Admins"]
#   silent:  false: it makes a sound for those who get notifications from the channel, ping or no ping
# /huragok gallery shows every one of them in its colour. [feed.<name>] enabled switches a whole group.
[messages]
# A ticket's line can also say where that kind of card goes when it's finished, over [tickets] when_closed: closes_to = "#its-own-channel", "logs" to share one, "stay" or "thread".
# Any line can say: remove_after_minutes = minutes (the post goes after that long), stale_after_hours = hours (a ticket nobody's touched finishes itself), as = "ticket", "log" or "post" (what it is, whichever channel it's sent to).
# What people did with their own hands: a card each in logs, whose buttons still work (acting on it brings it back to staff)
moderation-ban           = { channel = "logs", colour = "crimson", post = true, ping = "" }
moderation-kick          = { channel = "logs", colour = "orange", post = true, ping = "" }
moderation-mute          = { channel = "logs", colour = "amber", post = true, ping = "" }
moderation-warn          = { channel = "logs", colour = "yellow", post = true, ping = "" }
moderation-unmute        = { channel = "logs", colour = "mint", post = true, ping = "" }
moderation-unban         = { channel = "logs", colour = "emerald", post = true, ping = "" }
moderation-pardon        = { channel = "logs", colour = "teal", post = true, ping = "" }
# What Vergil did, and who to keep an eye on: a ticket each, for staff to act on or acknowledge
vergil-strike            = { channel = "staff", colour = "gold", post = true, ping = "" }
vergil-name-kick         = { channel = "staff", colour = "coral", post = true, ping = "" }
vergil-heard             = { channel = "staff", colour = "amber", post = true, ping = "" }
vergil-name-asked        = { channel = "staff", colour = "peach", post = true, ping = "" }
watch-flagged-joined     = { channel = "staff", colour = "fuchsia", post = true, ping = "", stale_after_hours = 12 }
watch-back-after-kick    = { channel = "staff", colour = "coral", post = true, ping = "", stale_after_hours = 12 }
watch-staff-lookalike    = { channel = "staff", colour = "plum", post = true, ping = "", stale_after_hours = 12 }
watch-banned-elsewhere   = { channel = "staff", colour = "rose", post = true, ping = "", stale_after_hours = 12 }
watch-anti-cheat         = { channel = "staff", colour = "crimson", post = true, ping = "", stale_after_hours = 12 }
# People asking staff for something: a ticket each, until someone closes it
calls-called             = { channel = "reports", colour = "yellow", post = true, ping = "", silent = false, stale_after_hours = 24 }
contact-opened           = { channel = "reports", colour = "sky", post = true, ping = "", silent = false }
console-cleared          = { channel = "logs", colour = "lilac", post = true, ping = "" }
appeals-made             = { channel = "appeals", colour = "teal", post = true, ping = "", silent = false }
reports-made             = { channel = "reports", colour = "orange", post = true, ping = "", silent = false, stale_after_hours = 336 }
reports-message          = { channel = "reports", colour = "orange", post = true, ping = "", silent = false, stale_after_hours = 336 }
reports-many             = { channel = "reports", colour = "orange", post = true, ping = "", silent = false, remove_after_minutes = 60 }  # ping: who to tell when enough people report the same player
requests-asked           = { channel = "reports", colour = "sky", post = true, ping = "" }
tickets-opened           = { channel = "staff", colour = "steel", post = true, ping = "", stale_after_hours = 24 }
# What's wrong with the servers: a ticket per problem, closed when it's over
alerts-crashed           = { channel = "alerts", colour = "red", post = true, ping = "" }
alerts-faulted           = { channel = "alerts", colour = "maroon", post = true, ping = "" }
alerts-hung              = { channel = "alerts", colour = "rose", post = true, ping = "" }
alerts-start-failed      = { channel = "alerts", colour = "pink", post = true, ping = "" }
alerts-update-failed     = { channel = "alerts", colour = "magenta", post = true, ping = "" }
alerts-slow              = { channel = "alerts", colour = "peach", post = true, ping = "" }
alerts-watchdog-restart  = { channel = "alerts", colour = "orange", post = true, ping = "" }
alerts-part-off          = { channel = "alerts", colour = "brown", post = true, ping = "" }
alerts-rcon-sign-in      = { channel = "alerts", colour = "fuchsia", post = true, ping = "" }
alerts-relay-lockout     = { channel = "alerts", colour = "plum", post = true, ping = "" }
# One line each, with nothing to act on: what Vergil and the Superintendent are up to
vergil-would             = { channel = "huragok-logs", colour = "slate", post = true, ping = "" }
watch-first-time-quiet   = { channel = "huragok-logs", colour = "lilac", post = true, ping = "" }
alerts-recovered         = { channel = "huragok-logs", colour = "green", post = true, ping = "" }
alerts-huragok-started   = { channel = "huragok-logs", colour = "blurple", post = true, ping = "" }
servers-started          = { channel = "huragok-logs", colour = "lime", post = true, ping = "" }
servers-adopted          = { channel = "huragok-logs", colour = "olive", post = true, ping = "" }
servers-stopped          = { channel = "huragok-logs", colour = "slate", post = true, ping = "" }
servers-restarted        = { channel = "huragok-logs", colour = "chartreuse", post = true, ping = "" }
servers-repaired         = { channel = "huragok-logs", colour = "cyan", post = true, ping = "" }
content-workshop         = { channel = "huragok-logs", colour = "navy", post = true, ping = "" }
# One line each, with nothing to act on: what people did
vergil-name-ban          = { channel = "logs", colour = "purple", post = true, ping = "" }
vergil-name-allowed      = { channel = "logs", colour = "lavender", post = true, ping = "" }
vergil-word-ban          = { channel = "logs", colour = "violet", post = true, ping = "" }
vergil-word-allowed      = { channel = "logs", colour = "lilac", post = true, ping = "" }
vergil-rule-changed      = { channel = "logs", colour = "indigo", post = true, ping = "" }
vergil-pardon            = { channel = "logs", colour = "aqua", post = true, ping = "" }
votes-called             = { channel = "logs", colour = "sky", post = true, ping = "" }
votes-passed             = { channel = "logs", colour = "red", post = true, ping = "" }
votes-failed             = { channel = "logs", colour = "green", post = true, ping = "" }
votes-cancelled          = { channel = "logs", colour = "grey", post = true, ping = "" }
joins-first              = { channel = "logs", colour = "sky", post = true, ping = "" }
joins-back               = { channel = "logs", colour = "turquoise", post = false, ping = "" }
joins-new-name           = { channel = "logs", colour = "lavender", post = true, ping = "" }
joins-refused            = { channel = "logs", colour = "rose", post = true, ping = "" }
joins-joined             = { channel = "logs", colour = "cyan", post = false, ping = "" }
joins-left               = { channel = "logs", colour = "silver", post = false, ping = "" }
audit-settings           = { channel = "logs", colour = "violet", post = true, ping = "" }
audit-notes              = { channel = "logs", colour = "lavender", post = true, ping = "" }
audit-console            = { channel = "logs", colour = "lilac", post = true, ping = "" }
