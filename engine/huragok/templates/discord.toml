season_reset = true            # Tax Dollars reset each season
daily_limit = 20               # plays per member per day across all games
quiet_hours = "01:00-08:00"    # no random posts (payphone, bounties) in these hours
min_players = 4                # a game counts only with this many players...
min_minutes = 5                # ...and this long played
practice_servers = []          # servers whose games never count

[games.record]                 # /record: the service record
enabled = false
[games.carnage_report]         # the end-of-game card (also [matches])
