[games.ballot_forecast]        # which game will the lobby ballot pick
enabled = false
[games.bounty]                 # Wanted: Killjoy bounty on the week's opted-in top player
enabled = false
[games.king]                   # Hail to the King: a role for the last big game's top scorer
enabled = false
