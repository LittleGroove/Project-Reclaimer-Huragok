enabled = false
[games.forge_contest]          # monthly maps and variants contest
enabled = false
[games.good_citizens]          # public totals; Good Samaritan for a clean month
enabled = false


# ---------------------------------------------------------------------------------
# Moderating the Discord itself. All off by default.
[moderation]
enabled = false
automod_words = false          # write Vergil's banned words into a Discord AutoMod rule
automod_action = "block"       # block | alert | timeout
automod_preset = []            # Discord's own lists: profanity | sexual | slurs
automod_spam = false
automod_mentions = 0           # 0 off; else the most mentions in one message
vergil_on_chat = false         # Vergil's ladder on Discord messages (needs Message Content)
shared_strikes = false         # Discord strikes and game strikes count together
mute_as = "timeout"            # how a Vergil mute looks in Discord: timeout | role
mute_role = ""
cross_ban_game_to_discord = "ask"   # nothing | ask | timeout | kick | ban
cross_ban_discord_to_game = "ask"   # nothing | ask | ban
commands = false               # /timeout /dkick /dban /purge /slowmode /lock for Discord staff
raid_guard = false
raid_joins = 10                # this many joins...
raid_seconds = 60              # ...within this long
raid_action = "alert"          # alert | lock
min_account_days = 0           # hold accounts younger than this
logs = false                   # edited and deleted messages, joins, leaves, role and nickname changes
logs_channel = "logs"


# ---------------------------------------------------------------------------------
# Who the bot posts as (bot mode posts through its own webhooks for this).
[personas]
enabled = true
superintendent = { name = "Superintendent", picture = "" }
vergil = { name = "Vergil", picture = "" }
huragok = { name = "Huragok", picture = "" }

# Every text the bot posts can be reworded here: [text] key = "words with {placeholders}".
# The window lists every key and its default.
[text]


# ---------------------------------------------------------------------------------
[privacy]
player_ids = "staff"           # staff (staff channels only) | never. IP addresses are never posted.
opt_out = true                 # players may hide from public stats and boards
keep_days = 365                # Discord-only records: reports, tickets, links of members who left
forget_me = true               # /forget me: a member deletes what the bot keeps about them


# ---------------------------------------------------------------------------------
# Floors on every timer. Raise them freely; Huragok won't go below the numbers in the notes.
[limits]
status_seconds = 120           # status boards (never under 60)
rename_minutes = 10            # channel names and topics, together (never under 5; Discord allows 2 in 10 minutes)
voice_status_minutes = 3       # (never under 1)
presence_seconds = 120         # (never under 30)
profile_minutes = 15           # bio and nickname (never under 15); pictures never under 60
roles_per_second = 1           # role changes (bursts of 5 at most)
roles_check_minutes = 15       # a full check of every synced role
boards_minutes = 15            # leaderboards edited (never under 5); posted never more than hourly
chat_batch_seconds = 3         # the chat bridge (never under 2), at most chat_per_minute messages
chat_per_minute = 20
logins_per_day = 100           # past this, the bot stops and alerts the host (Discord resets the token at 1,000)
wait_seconds = 30              # give up on any Discord wait longer than this and report it
