[games.kiosk]                  # /kiosk trivia
enabled = false
per_day = 5
questions = "kiosk-questions.toml"   # a Discord can add its own
[games.data_hive]              # the weekly puzzle, floor by floor
enabled = false
[games.repair]                 # the Huragok repair puzzle after a real crash, once the server is back
enabled = false
[games.huragok_name]           # /huragokname
enabled = false
[games.birthdays]              # Grunt Birthday Party milestones
enabled = false
[games.rare_lines]             # IWHBYD: rare canon city lines in routine posts
enabled = false
