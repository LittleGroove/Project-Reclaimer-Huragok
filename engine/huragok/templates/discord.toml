# ---------------------------------------------------------------------------------
# The servers at a glance. Every template takes placeholders: {server} {map} {mode}
# {players} {max} {next} {state} {uptime} {playlist} {players_total}
# {servers_up} {servers} {unique_players}.
[status.board]
enabled = false
channel = "status"             # the bot deletes and reposts its own cards here when a server's added or removed
webhook = ""
layout = "per-server"          # per-server (a message each) | one (one message for all)
servers = "*"
show = ["state", "map", "mode", "players", "next", "uptime", "playlist"]  # also: votes, version
player_list = "names"          # names | off
join_button = true             # public servers get a Join button (the game's own join page)
join_address = {}              # "Server 1" = "203.0.113.4:11774"; empty: the server's public address
update_seconds = 120           # at least 60
colours = { up = "green", busy = "gold", down = "red", restarting = "grey" }
all_servers = false            # also one message with a row per server

[status.seeding]
enabled = false
webhook = ""
seed_at = [1, 3]               # post when a server has between this many players (seeding-wanted in [messages]: ping an opt-in role there)
cooldown_minutes = 120         # per server

[status.presence]
enabled = false
lines = ["{players_total} Spartans on {servers_up} servers", "{map} · {mode} on {server}"]  # a line that comes out with nothing to say is skipped
activity = "watching"          # playing | listening | watching | competing | custom
rotate_seconds = 120           # at least 30
dot = "health"                 # health (online / idle when one is down / do-not-disturb when all are; one you stopped isn't down) | online

[status.bio]
enabled = false
text = "{servers_up} servers up · {players_total} playing · {unique_players} Spartans so far"
update_minutes = 30

[status.nickname]
enabled = false
template = "Huragok · {players_total} on"
update_minutes = 15

[status.channel_names]
enabled = false
channels = {}                  # "#server1" = { server = "Server 1", template = "{state_emoji} Server 1: {players}/{max}" }, or a template about them all: "#totals" = "{players_total} on"
update_minutes = 10            # at least 5: Discord allows a channel 2 name/topic changes in 10 minutes

[status.topics]
enabled = false
channels = {}                  # as channel_names
update_minutes = 10

[status.voice_status]
enabled = false
channels = {}                  # "Server 1 Comms" = { server = "Server 1", template = "{map} · {mode} {players}/{max}" }
update_minutes = 3             # at least 1


# ---------------------------------------------------------------------------------
[notify]
enabled = false                # /notify: members pick their own alerts, a server reaching N players or a game type starting (notify-told in [messages])
cooldown_minutes = 120         # each alert, at most this often


# ---------------------------------------------------------------------------------
# The console from Discord: lines typed in a channel. Every command as a slash command
# is [commands]; these ask for Message Content Intent on the developer portal's Bot page.
[console]
typed = false                  # lines typed in a console channel run on a server. It needs Message Content Intent, on the developer portal's Bot page
layout = "picker"              # per-server (a channel each) | picker (one channel, pick the server)
channel = "console"            # the picker's channel, on per-server too if it's set: the way to a server without a channel
channels = {}                  # the per-server layout: { "Server 1" = "#server1-console" }
server_prefix = true           # "server1: kick 3" names the server on the line
remember_server = "member"     # the picker remembers each member's server | channel (one for everyone)
raw_rank = "admin"             # who can type console lines, not only Huragok's ! commands: moderator | admin | owner | off
public = false                 # true: it runs in a channel anyone can read, answers and all. Otherwise it waits until the channel's private
confirm = ["endgame", "endround", "reload", "password", "restartserver", "ban"]  # lines that ask "are you sure?" first
answers = "reply"              # reply | thread
long_answers = "file"          # file | split
ignore_others = "ignore"       # ignore | delete: lines from people without a rank
ignore_prefix = ""             # a line starting with this is ignored, so staff can talk there: "//"
audit = "changes"              # changes | everything: which lines go in the audit log. What only looks isn't worth a line
clear_after_minutes = 10       # nothing said or pressed this long: the channel's cleared, and it's ready to use again. 0: never. At least 5. The bot needs Manage Messages there
transcript = true              # what was there goes to console-cleared first, as a file. false: it's only cleared
forget_server = true           # clearing also forgets the server each person picked, so a line after a long quiet doesn't go to one they've forgotten choosing


# ---------------------------------------------------------------------------------
# How long what the bot says stays, so channels hold what's still needed. 0: it stays until someone dismisses it.
[answers]
done_minutes = 10              # a private answer saying what happened. At most 14, as Discord won't let the bot touch it later
looks_minutes = 14             # a private answer someone asked to read: /whois, /case, /status. At most 14
public_minutes = 10            # a command's answer that everyone can see ([commands] public)
tests_minutes = 10             # /huragok test's posts


# ---------------------------------------------------------------------------------
# Slash commands and right-click commands.
[commands]
enabled = false
game_commands = true           # every in-game command as a slash command, same rank as commands.toml
staff_permission = "manage_messages"  # staff's commands only show to members with this Discord permission (""): your rank is what decides, whatever shows. Server Settings, Integrations can change who sees each
names = {}                     # rename any: { whois = "lookup" }. Already different from the game, where its name there would mislead: /bannedwords (!rules), /bannednames (!bannames), /letback (!pardon), /clearstrikes (!pardonplayer), /reloadserver (!reload)
hidden = []                    # never registered
power_rank = "admin"           # who can use /server's power buttons: moderator | admin | owner
power_buttons = ["start", "stop", "restart", "restart-after-game", "restart-when-empty", "cancel", "updates"]  # on /server, each asking first
shown_as = "{name}"            # how someone acting from Discord is named to players ("Bravo was kicked by Mod"). {name} is their name in this Discord. "{name} (Discord)", or "a moderator" to name nobody. Staff's cards always have their real name
public = []                    # commands whose answer everyone in the channel sees. The rest are only the asker's


# ---------------------------------------------------------------------------------
[reports]
enabled = false
from = ["game", "discord"]     # !report in game, /report and right-click in Discord
evidence_lines = 8
threshold = 3                  # this many different reporters... (0: never. Who's pinged is [messages] reports-many)
threshold_minutes = 10         # ...within this long pings staff
buttons = ["mute", "kick", "ban", "strike", "warn", "whois", "note"]  # on its card, with Dismiss. Strike is for what the word list can't hear, like voice. Warn shows while they're on. Empty: as [tickets] buttons
right_click = true             # "Report message" when someone right-clicks a message
thank_reporter = true
reporter_cooldown_seconds = 60
most_at_once = 5               # how many open tickets one person's reports can have at a time. 0: no limit
tell_in_game = true            # moderators and up on the servers are told of a report or a call: they're the only staff who can hear what's being reported
tell_reporter = "acted"        # acted: they're told when staff act on their report | all: and when it's dismissed | no
acted_after_hours = 24         # a report someone's acted on finishes itself after this long, so `reports` holds what's still waiting. 0: as its line says

[appeals]
enabled = false
for = ["ban"]                  # what can be appealed: ban | kick | mute
cooldown_days = 7              # the usual wait before they can appeal it again, unless something new's against them. Whoever denies one picks: this, a longer or shorter wait, or no more appeals
questions = ["What happened?", "Why should it be lifted?"]  # up to five
buttons = ["lift", "shorten", "deny"]  # on its card, for staff, with Close always there. deny: says why and whether they can ask again, tells them, and closes it. Close: nothing more's wanted, and it isn't held against them
tell_outcome = "dm"            # dm | no
lift_clears_strike = true      # accepting an appeal against what Vergil did takes that strike off too, or the next word carries on from it
code_only = false              # with {code} in in_reason: a name alone isn't enough to appeal. A /ban in game has no code, so those need Contact the staff
in_reason = ""                 # added to a ban's message in game, e.g. "Appeal on discord.gg/yours: /appeal {code}"

[contact]
enabled = false
channel = "info"               # where the "Contact the staff" button lives. Everyone needs to see it, and to have Send Messages in Threads there
categories = ["Question", "A problem with a server", "Something else"]  # empty: it doesn't ask. Reporting a player is /report's, and an appeal is /appeal's: those have the buttons
thread_role = ""               # the role brought into each thread, or several, e.g. ["@Moderators", "@Admins"]. Others press Discuss on its card to join
transcript = true              # a file of the thread when it's closed. It needs Message Content Intent, on the developer portal's Bot page
close_after_days = 7           # with nothing said for this long, a thread closes. 0: never
cooldown_minutes = 10          # one person can open another this long after their last, as each is a thread, a card and a ping. 0: any time

# ---------------------------------------------------------------------------------
# What staff write down about players (bot mode).
[notes]
enabled = false
expire_days = 0                # 0: notes never expire
flags = { watch = "red", "voice abuser" = "orange", trusted = "green", regular = "blue" }  # a word and its colour: add your own
watch_flags = ["watch", "voice abuser"]  # these tell staff when the player joins (watch-flagged-joined in [messages])
note_lines = 3                 # the latest notes shown on a case


# ---------------------------------------------------------------------------------
# Who the bot posts as (bot mode posts through its own webhooks for this).
[personas]
enabled = true
superintendent = { name = "Superintendent", picture = "" }
vergil = { name = "Vergil", picture = "" }
huragok = { name = "Huragok", picture = "" }

# What the bot says on its cards and in its answers can be reworded here: "ticket.closed" = "words with {placeholders}".
# The window lists every key and its default.
[text]


# ---------------------------------------------------------------------------------
# Floors on every timer. Raise them freely; Huragok won't go below the numbers in the notes.
[limits]
status_seconds = 60            # status boards (never under 60)
rename_minutes = 5             # channel names and topics, together (never under 5; Discord allows 2 in 10 minutes)
voice_status_minutes = 1       # (never under 1)
presence_seconds = 30          # (never under 30)
profile_minutes = 15           # bio and nickname (never under 15)
logins_per_day = 100           # past this, the bot stops and alerts the host (Discord resets the token at 1,000)
wait_seconds = 30              # a Discord wait longer than this is reported. Huragok keeps to the wait: it won't provoke Discord
